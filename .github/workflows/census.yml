name: census
on:
  schedule:
    - cron: "17 */3 * * *"   # ntfy keeps messages ~12h, so stay well under that
  workflow_dispatch:
    inputs:
      step:
        description: "run | collect | profile | discover | interact | report"
        default: run
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: restore the database from the data branch
        run: |
          mkdir -p data
          # the database lives only on the data branch: never run on (and then overwrite it with) an empty one
          git fetch -q --depth 1 origin data
          # the archive is census.db.gz, or census.db.gz.part-aa, -ab, ... once it outgrows GitHub's 100 MB file limit
          parts=$(git ls-tree --name-only FETCH_HEAD | grep -E '^census\.db\.gz(\.part-..)?$' | sort)
          for f in $parts; do git show "FETCH_HEAD:$f"; done | gunzip > data/census.db
          python -c "import sqlite3; n=sqlite3.connect('data/census.db').execute('select count(*) from posts').fetchone()[0]; assert n > 1000, n; print(n, 'posts restored')"
          python -c "import sqlite3; print(sqlite3.connect('data/census.db').execute('select count(*) from posts').fetchone()[0])" > /tmp/posts_before
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install websockets==17.4   # nostr relays (read-only)
      - run: npm install -g @anthropic-ai/claude-code
      - name: model auth (subscription token or API key, whichever secret exists)
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN=$OAUTH" >> "$GITHUB_ENV"; fi
          if [ -n "$KEY" ]; then echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"; fi
          if [ -z "$OAUTH$KEY" ]; then echo "NO_LLM=--no-llm" >> "$GITHUB_ENV"; echo "::warning::no model secret, running without LLM"; fi
      - name: census
        env:
          CENSUS_CREDS: ${{ secrets.CENSUS_CREDS }}
          CENSUS_LIVE: ${{ vars.CENSUS_LIVE }}
          GITHUB_TOKEN: ${{ github.token }}   # read-only GitHub API calls in forensics (commit timelines)
        run: python -m census ${{ inputs.step || 'run' }} $NO_LLM
      - name: save the database to the data branch (one commit, replaced each run)
        run: |
          python -c "
          import sqlite3; c = sqlite3.connect('data/census.db')
          n = c.execute('select count(*) from posts').fetchone()[0]; before = int(open('/tmp/posts_before').read())
          assert n >= 0.95 * before, f'refusing to save: posts went from {before} to {n}'
          c.execute('vacuum')"
          D=$(mktemp -d)
          gzip -9 -c data/census.db | split -b 90m -a 2 - "$D/census.db.gz.part-"
          cp data/census.json "$D/" 2>/dev/null || true
          printf '# agent-census data\n\nSQLite snapshot of the census (gzip). Replaced on every run; code is on main.\n' > "$D/README.md"
          cd "$D"
          git init -q -b data
          git config user.name "agent-census"
          git config user.email "agent-census@users.noreply.github.com"
          git add -A
          git commit -qm "census $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
      - uses: actions/configure-pages@v5
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: census
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
